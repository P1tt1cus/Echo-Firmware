name: Echo firmware
on:
  push:
    branches: [studio]
  pull_request:
    branches: [studio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned API
        run: test "$(sed -n '2p' targets/f7/api_symbols.csv)" = 'Version,+,87.1,,'
      - name: Build Echo firmware and firmware-only update
        run: FBT_NO_SYNC=1 ./fbt -j4 firmware_all updater_minpackage fap_infrared fap_nfc fap_subghz fap_momentum_app fap_echo_replay fap_lfrfid fap_bad_kb SKIP_EXTERNAL=1
      - name: Check Echo assets and version metadata
        run: |
          . scripts/toolchain/fbtenv.sh
          python3 scripts/echo_validate.py
          python3 scripts/echo_menu_test.py
          python3 scripts/echo_dashboard_test.py
          python3 scripts/echo_replay_test.py
          python3 scripts/echo_replay_control_test.py
          python3 scripts/echo_shared_menu_test.py
          python3 scripts/echo_browser_test.py
          python3 scripts/echo_rfid_test.py
          python3 scripts/echo_nfc_status_test.py
          python3 scripts/echo_subghz_history_test.py
          python3 scripts/echo_subghz_control_test.py
          python3 scripts/echo_hid_control_test.py
          python3 scripts/echo_hid_view_test.py
          python3 scripts/echo_hid_profile_test.py
          python3 scripts/echo_ir_view_test.py
          python3 scripts/echo_ir_control_test.py
          python3 scripts/echo_ir_file_test.py
          python3 scripts/echo_ir_exit_test.py
          python3 scripts/echo_filename_test.py
          python3 scripts/echo_installer_test.py --package-check
      - uses: actions/upload-artifact@v4
        with:
          name: echo-f7-api87.1
          path: |
            dist/f7-C/
            build/f7-firmware-C/.extapps/infrared.fap
            build/f7-firmware-C/.extapps/nfc.fap
            build/f7-firmware-C/.extapps/subghz.fap
            build/f7-firmware-C/.extapps/momentum_app.fap
            build/f7-firmware-C/.extapps/echo_replay.fap
            build/f7-firmware-C/.extapps/lfrfid.fap
          include-hidden-files: true
          if-no-files-found: error
