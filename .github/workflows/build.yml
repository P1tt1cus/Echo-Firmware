name: Echo firmware
on:
  push:
    branches: [studio]
  pull_request:
    branches: [studio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned API
        run: test "$(sed -n '2p' targets/f7/api_symbols.csv)" = 'Version,+,87.1,,'
      - name: Build Echo firmware and firmware-only update
        run: FBT_NO_SYNC=1 ./fbt -j4 firmware_all updater_minpackage SKIP_EXTERNAL=1
      - name: Check Echo assets and version metadata
        run: |
          . scripts/toolchain/fbtenv.sh
          python3 scripts/echo_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: echo-f7-api87.1
          path: dist/f7-C/
          if-no-files-found: error
