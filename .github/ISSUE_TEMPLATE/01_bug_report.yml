name: Bug report
description: Report a bug in Echo Firmware.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report Echo-specific issues here. Include the affected app and whether external hardware is involved.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug.
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: "How can this bug be reproduced?"
      placeholder: |
        1. Switch on...
        2. Press button '....'
        3. Observe the result
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Echo version and hardware
      description: Include firmware version, commit, app version and any external board.
      # Target seems to be largely ignored by outside sources.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach your debug logs here
      render: Text
      # Avoid rendering as Markdown here.
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Let us know if you have anything else to share.
